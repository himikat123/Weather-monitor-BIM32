[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 460800

lib_ldf_mode = deep+
lib_compat_mode = off

board_build.partitions = custom_partitions.csv
board_build.filesystem = littlefs

build_flags = 
    -std=gnu++17
    -Llib/BSEC_Software_Library/src/esp32
    -lalgobsec

build_unflags =
    -std=gnu++11
    -std=gnu++14

lib_deps =
    WiFi
    WiFiClientSecure
