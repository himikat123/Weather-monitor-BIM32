[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200

lib_ldf_mode = deep+

board_build.partitions = no_ota.csv
board_build.filesystem = littlefs

build_flags = 
    -std=gnu++17

    -I$PIOHOME_DIR/packages/framework-arduinoespressif32/libraries/WiFi/src
    -I$PIOHOME_DIR/packages/framework-arduinoespressif32/libraries/WiFiClientSecure/src

build_unflags =
    -std=gnu++11
    -std=gnu++14

lib_deps =
    WiFi
    WiFiClientSecure
